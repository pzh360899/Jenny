name: Android Pure Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk android-sdk-platform-tools android-sdk-build-tools
          export ANDROID_HOME=/usr/lib/android-sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | head -n 1)
          
          # 创建最小 Android 项目结构
          mkdir -p app/src/main/res/values app/src/main/java/com/example
          
          # 生成清单文件
          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.jenny">
              <application android:label="Jenny">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 生成简单布局
          cat > app/src/main/res/layout/activity_main.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:text="Hello Jenny" />
          EOF
          
          # 生成 Java 代码
          cat > app/src/main/java/com/example/MainActivity.java <<EOF
          package com.example.jenny;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle s) { super.onCreate(s); setContentView(R.layout.activity_main); }
          }
          EOF
          
          # 纯命令行编译 (aapt2 + d8)
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | head -n 1)
          PLATFORM=$(ls $ANDROID_HOME/platforms | head -n 1)
          
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2 compile -o app/res.apk app/src/main/res/values/*.xml app/src/main/res/layout/*.xml
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2 link -I $ANDROID_HOME/platforms/$PLATFORM/android.jar -o app/app-unaligned.apk -m -J app/src/main/java/com/example --manifest app/src/main/AndroidManifest.xml app/res.apk
          
          javac -cp "$ANDROID_HOME/platforms/$PLATFORM/android.jar" -d app/classes app/src/main/java/com/example/*.java
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/d8 --output app/dex app/classes/*.class
          
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2 add app/app-unaligned.apk app/dex/classes.dex
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -f 4 app/app-unaligned.apk app/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/app-debug.apk
